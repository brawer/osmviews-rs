# SPDX-License-Identifier: MIT
#
# Publishes a tagged release to crates.io via Trusted Publishing (OIDC, no
# stored token) and generates SLSA build-provenance for the packaged .crate
# (kept in the repo's attestation store, not attached to the release).
#
# One-time setup is required on crates.io and GitHub — see RELEASING.md.
#
# release-please pushes the vX.Y.Z tag as a GitHub App (see release-please.yml)
# and creates the GitHub release, so `push: tags` launches this automatically
# after a release PR is merged. The `workflow_dispatch` trigger is a fallback for
# re-running a release:
#
#     gh workflow run release.yml --ref vX.Y.Z

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Tag matches Cargo.toml version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate    tag: $tag"
          test "$crate" = "$tag"

      - run: cargo test --locked --all-features

      - name: Resolve the current OSMViews dataset
        id: dataset
        run: | # keep in sync with osmviews::DATAPACKAGE_URL
          curl -fsSL -o datapackage.json \
            --connect-timeout 60 --retry 5 --retry-delay 15 --retry-all-errors \
            https://osmviews.brawer.ch/data/datapackage.json
          raster='.resources[] | select(.name == "osmviews")'
          path=$(jq -er "$raster | .path" datapackage.json)
          hash=$(jq -er "$raster | .hash" datapackage.json)
          [[ "$path" =~ ^osmviews-[0-9]{8}\.tiff$ ]] || { echo "unexpected path: $path"; exit 1; }
          [[ "$hash" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected hash: $hash"; exit 1; }
          echo "$path  $hash"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=${hash#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Download the OSMViews dataset
        env:
          RASTER_PATH: ${{ steps.dataset.outputs.path }}
        run: |
          # Retry generously, but give up on a connection that stalls below
          # 1 KiB/s for 5 minutes so a dead transfer fails in minutes instead of
          # hanging for hours.
          curl -fSL -o osmviews.tiff \
            --connect-timeout 60 --retry 5 --retry-delay 15 --retry-all-errors \
            --speed-limit 1024 --speed-time 300 \
            "https://osmviews.brawer.ch/data/$RASTER_PATH"

      - name: Verify the dataset against the data package
        env:
          RASTER_SHA256: ${{ steps.dataset.outputs.sha256 }}
        run: echo "$RASTER_SHA256  osmviews.tiff" | sha256sum --check --strict

      - name: Run the ignored tests against the real dataset
        run: cargo test --release --locked --all-features -- --ignored

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # checkout
      id-token: write # OIDC for crates.io Trusted Publishing + provenance
      attestations: write # store the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Package the crate
        run: cargo package --locked

      - name: Locate the .crate file
        id: crate
        run: echo "path=$(ls target/package/*.crate)" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.crate.outputs.path }}

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
