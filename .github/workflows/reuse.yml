name: REUSE

# No `paths:` filter: adding any file without licensing info breaks compliance,
# so every push and pull request is checked.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
