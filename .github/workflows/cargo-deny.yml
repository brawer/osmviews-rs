name: cargo-deny

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/cargo-deny.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/cargo-deny.yml]
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC — catch newly published advisories

permissions: {}

jobs:
  cargo-deny:
    name: check dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources licenses
