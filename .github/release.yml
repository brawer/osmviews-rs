#
# Groups the auto-generated release notes (gh release create --generate-notes,
# used by .github/workflows/release.yml) by pull-request label. Labels are
# applied automatically from the Conventional Commits PR title by the
# auto-label job in .github/workflows/conventional-commits.yml.
#
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: 🚨 Breaking changes
      labels:
        - breaking-change
    - title: 🆕 Features
      labels:
        - enhancement
    - title: 🐞 Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🔗 Dependencies
      labels:
        - dependencies
    - title: 🚧 Maintenance
      labels:
        - "*"
      exclude:
        labels:
          - breaking-change
          - enhancement
          - bug
          - documentation
          - dependencies
